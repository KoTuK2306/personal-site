<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#16161f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="180" fill="url(#accent)" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1000" cy="500" r="220" fill="url(#accent)" opacity="0.06" filter="url(#glow)"/>

  <!-- Grid pattern -->
  <g opacity="0.03">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <!-- Content -->
  <text x="120" y="220" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800" fill="#f0f0f5">Алешин Дмитрий</text>
  <text x="120" y="290" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="400" fill="#9ca3af">Senior Frontend Developer &amp; Team Lead</text>

  <!-- Accent line -->
  <rect x="120" y="330" width="120" height="6" rx="3" fill="url(#accent)"/>

  <!-- Skills row -->
  <text x="120" y="420" font-family="'JetBrains Mono', monospace" font-size="20" fill="#6b7280">React 18 · TypeScript · Redux Toolkit · Next.js · WebSocket</text>

  <!-- Badge -->
  <rect x="120" y="480" width="260" height="44" rx="22" fill="#16161f" stroke="#252535" stroke-width="1"/>
  <circle cx="150" cy="502" r="6" fill="#10b981"/>
  <text x="170" y="508" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#9ca3af">Открыт к предложениям</text>

  <!-- Logo -->
  <rect x="980" y="100" width="80" height="80" rx="16" fill="url(#accent)"/>
  <text x="1020" y="152" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">DA</text>
</svg>